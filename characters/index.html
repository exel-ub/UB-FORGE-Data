<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<meta name="robots" content="noindex,nofollow">
<meta name="referrer" content="no-referrer">
<meta http-equiv="Content-Security-Policy" content="default-src 'self'; script-src 'self'; connect-src 'self'; img-src 'self' data:; style-src 'self' 'unsafe-inline' https://fonts.googleapis.com; font-src https://fonts.gstatic.com; form-action 'none'; base-uri 'none'">
<title>Characters · UB:FORGE</title>
<link rel="icon" href="../assets/icon-64.png"><link rel="apple-touch-icon" href="../assets/apple-touch-icon.png">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Barlow:wght@400;500;600&family=Oxanium:wght@500;600;700&display=swap">
<link rel="stylesheet" href="../assets/site.css">
<style>
:root{--el-fire:#E8746A;--el-water:#6FA8E8;--el-wind:#7FC79A;--el-earth:#C9A46A;--el-light:#EBD27A;--el-dark:#A98AE8;--el-none:#9AA4B1}
.head{padding-top:36px;padding-bottom:18px}
.head h1{font-size:clamp(30px,5vw,44px)}
.head p{margin:8px 0 0;max-width:68ch}
.tools{background:rgba(23,27,33,.95);backdrop-filter:blur(8px);border-top:1px solid var(--rule);border-bottom:1px solid var(--rule);padding:12px 0}
@media (min-width:900px){.tools{position:sticky;top:0;z-index:5}}
.tools .wrap{display:flex;flex-wrap:wrap;gap:10px 14px;align-items:center}
#q{flex:1 1 240px}
.tools select{min-width:0}
.els{display:flex;flex-wrap:wrap;gap:6px}
.els button{border:1px solid var(--rule);background:transparent;border-radius:999px;padding:5px 11px;cursor:pointer;color:var(--steel);font-size:14px;display:inline-flex;gap:6px;align-items:center}
.els button i{width:9px;height:9px;border-radius:50%;background:var(--c)}
.els button[aria-pressed="true"]{border-color:var(--c);color:var(--bright);background:rgba(255,255,255,.04)}
.count{padding:14px 0 8px;font-size:15px;color:var(--steel)}
.grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(150px,1fr));gap:12px;padding-bottom:60px}
.ch{background:var(--plate);border:1px solid var(--rule);border-radius:var(--r-m);overflow:hidden;cursor:pointer;text-align:left;padding:0;display:flex;flex-direction:column;color:inherit;font:inherit;min-width:0}
.ch:hover{border-color:var(--steel)}
.ch .pic{position:relative;aspect-ratio:1/1;background:#1a1f26;border-bottom:3px solid var(--c)}
.ch .pic img{display:block;width:100%;height:100%;object-fit:cover}
.ch .rar{position:absolute;left:6px;top:6px;font:600 12px var(--display);background:rgba(15,18,23,.82);color:#f3d27a;padding:2px 6px;border-radius:4px;letter-spacing:.04em}
.ch .b{padding:8px 10px 10px;display:flex;flex-direction:column;gap:2px;flex:1}
.ch .t{font-size:12px;color:var(--steel);line-height:1.3;display:-webkit-box;-webkit-line-clamp:2;-webkit-box-orient:vertical;overflow:hidden}
.ch .n{font:600 16px/1.2 var(--body)}
.ch .m{margin-top:auto;padding-top:6px;font-size:12px;color:var(--steel);display:flex;flex-wrap:wrap;gap:4px 8px}
.el{color:var(--c)}
dialog{max-width:min(860px,calc(100vw - 24px))}
.dv img{display:block;width:100%;aspect-ratio:4/3;object-fit:cover;background:#1a1f26}
.dv .in{padding:16px 18px 18px}
.dv h2{font-size:24px}
.dv .sub{color:var(--steel);margin:2px 0 12px}
.facts{display:flex;flex-wrap:wrap;gap:6px;margin-bottom:12px}
.facts span{font-size:13px;border:1px solid var(--rule);border-radius:4px;padding:2px 8px;color:var(--steel)}
.facts .el{border-color:var(--c)}
.dv p.desc{margin:0 0 14px;line-height:1.55}
.dv h3{font:600 13px var(--display);letter-spacing:.08em;text-transform:uppercase;color:var(--steel);margin:6px 0 6px}
.dv ul{margin:0;padding-left:18px}
.dv li{margin:3px 0}
.close{position:absolute;right:10px;top:10px;background:rgba(15,18,23,.85);border:1px solid var(--rule);color:var(--bright);border-radius:var(--r-s);padding:6px 10px;cursor:pointer}
.empty{padding:30px 0;color:var(--steel)}
[hidden]{display:none!important}
</style>
</head>
<body>
<header class="bar"><div class="wrap"><a class="brand" href="../"><img src="../assets/icon-64.png" alt="">UB:FORGE</a>
<nav><a href="../catalog/">Catalog</a><a href="../calendar/">Calendar</a><a href="./" aria-current="page">Characters</a><a href="../codes/">Codes</a></nav></div></header>
<main>
  <div class="wrap head">
    <h1>Characters</h1>
    <p class="muted">Every playable character in the Forge, with element, weapon and the week they first show up in scouts on the schedule. Pick one to see their full art and story.</p>
  </div>
  <div class="tools">
    <div class="wrap">
      <input class="field" type="search" id="q" placeholder="Search a name or title" aria-label="Search characters">
      <div class="els" id="els" role="group" aria-label="Element"></div>
      <select class="field" id="weapon" aria-label="Weapon"><option value="">All weapons</option></select>
      <select class="field" id="source" aria-label="How to get"><option value="">Any source</option></select>
      <select class="field" id="rarity" aria-label="Rarity"><option value="">Any rarity</option><option value="4">★4</option><option value="3">★3</option><option value="2">★2</option></select>
      <select class="field" id="sort" aria-label="Sort"><option value="week">Sort: schedule order</option><option value="name">Sort: name</option><option value="element">Sort: element</option></select>
    </div>
  </div>
  <div class="wrap">
    <p class="count" id="count"></p>
    <div class="grid" id="grid"></div>
    <p class="empty" id="empty" hidden>No characters match.</p>
  </div>
</main>
<dialog id="dlg"><div class="dv" id="dv"></div></dialog>
<script src="characters.js"></script>
</body>
</html>
